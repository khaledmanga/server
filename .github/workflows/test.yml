name: test

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: configure
        run: cmake -S . -B build

      - name: build
        run: cmake --build build --parallel

      - name: test
        run: ctest --test-dir build --output-on-failure
