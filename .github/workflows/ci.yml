name: CI

on:
  push:
    branches: [main]
    pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DMAKE_BUILD_TYPE=Release
        
      - name: Build
        run: cmake --build build --config Release --parallel
        
      - name: Test
        run: ctest --test-dir build --output-on-failure